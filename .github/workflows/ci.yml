name: CI Automation Framework

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear carpetas de reportes y logs
        run: mkdir -p reports/screens logs

      - name: Ejecutar suite completa (UI + API + BDD)
        run: pytest

      - name: Subir reporte HTML y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-y-evidencias
          path: |
            reports/
            logs/