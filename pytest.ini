[pytest]
pythonpath = .
testpaths = tests tests_api tests_behave
addopts = -v --html=reports/report.html --self-contained-html
html_report_title = Reporte Final de Automatización - UI + API + BDD
html_report_description = Framework de pruebas automatizadas con Pytest, Selenium, Requests y Behave
markers =
    api: Pruebas de servicios REST
    ui: Pruebas de interfaz web con Selenium
    smoke: Pruebas críticas rápidas
    e2e: Flujos completos de extremo a extremo
    bdd: Ejecución de escenarios Gherkin con Behave